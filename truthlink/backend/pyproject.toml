[project]
name = "truthlink"
version = "0.1.0"
description = "TruthLink: verified-source rumor verification engine"
authors = [
  { name = "TruthLink", email = "dev@truthlink.example" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "requests>=2.0",
  "beautifulsoup4>=4.12.0"
]

[project.scripts]
truthlink = "truthlink.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
